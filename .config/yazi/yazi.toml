[opener]
play = [
    # 1. Default: Detached Window (High Quality)
    { run = 'mpv --force-window "$@"', orphan = true, for = "unix", desc = "Play (Windowed)" },

    # 2. Option: Inline Terminal (Quick Preview)
    # Note: We use 'block = true' here so Yazi waits for mpv to finish 
    # and doesn't draw over the video.
    { run = 'mpv --vo=kitty --vo-kitty-use-shm=yes --profile=sw-fast "$@"', block = true, for = "unix", desc = "Play (Inline)" },

    # 3. Fallback: VLC (Just in case)
    { run = 'vlc "$@"', orphan = true, for = "unix", desc = "Play (VLC)" },
]
edit = [
	{ run = '$EDITOR "$@"', block = true, for = "unix" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]

[open]
rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },
	{ mime = "image/*", use = "open" },
	{ mime = "application/pdf", use = "open" },
    { mime = "inode/x-empty", use = "edit" }, # For empty files
    { mime = "inode/empty", use = "edit" }, # For empty files
	# { mime = "application/json", use = "edit" },
	{ name = "*.json", use = "edit" },

	# Multiple openers for a single rule
	{ name = "*.html", use = [ "open", "edit" ] },
]
