# remap prefix

unbind C-b
#set-option -g prefix C-n
set-option -g prefix C-space

# set mouse behavior

#set -g mouse on

# map toggle status bar

bind b set-option status

# set the current directory for new windows

bind c new-window -c "#{pane_current_path}"

# remap visual mode

unbind [
setw -g mode-keys vi
bind-key -T prefix v copy-mode

# remap split

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# remap pane-switching 

bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-Right select-pane -R
bind -n M-Left select-pane -L

# map switching windows

bind-key -n M-l select-window -t :+
bind-key -n M-h select-window -t :-


# rename off

#set-option -g automatic-rename off
#set-option -g window-status-format "#F*#W#F"
#set-option -g allow-rename on
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# initial window index

set-option -g base-index 1

# default shell

set-option -g default-shell /bin/zsh

set-option -g status-style bg=default

########## plugins ##########

# List of plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
#set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'christoomey/vim-tmux-navigator'
#set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
#set -g @vim_navigator_mapping_right "C-Right C-l"
#set -g @vim_navigator_mapping_up "C-k"
#set -g @vim_navigator_mapping_down "C-j"

# Options to make tmux more pleasant
#set -g mouse on
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_date_time_text " %Y-%d-%m / %H:%M"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-bg default
set -g status-style bg=default
set -g status-right "#{E:@catppuccin_status_application}"
#set -g status-right "#[bg=#{@thm_flamingo},fg=#{@thm_crust}]#[reverse]#[noreverse]󱀙  "
#set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(memory_pressure | awk '/percentage/{print $5}') "
#set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Start TPM
run '~/.config/tmux/plugins/tpm/tpm'
