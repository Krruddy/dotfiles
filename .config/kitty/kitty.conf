# ========== SHELL ==========
# Use zsh as the default shell
shell /bin/zsh

# ========== WINDOW ==========
# Opacity (0.0 transparent → 1.0 opaque)
background_opacity 0.8
dynamic_background_opacity yes

# Start maximized or fullscreen
#startup_session /home/ruddy/.local/share/kitty/sessions/remote.kitty-session
#startup_session /home/ruddy/.local/share/kitty/sessions/default_v1.kitty-session
# startup_session /home/ruddy/.local/share/kitty/sessions/main.kitty-session
#startup_session /home/ruddy/.local/share/kitty/sessions/23-jun-2026.kitty-session


# ========== FONT ==========
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size 16.0

# ========== colors ==========

foreground   #eaeaea
background   #000000
cursor       #eaeaea
cursor_text_color #000000

# Normal colors
# black
color0  #000000
# red
color1  #d54e53
# green
color2  #b9ca4a
# yellow
color3  #e6c547
# blue
color4  #7aa6da
# magenta
color5  #c397d8
# cyan
color6  #70c0ba
# white
color7  #eaeaea

# Bright colors
# bright black
color8  #666666
# bright red
color9  #ff3334
# bright green
color10 #9ec400
# bright yellow
color11 #e7c547
# bright blue
color12 #7aa6da
# bright magenta
color13 #b77ee0
# bright cyan
color14 #54ced6
# bright white
color15 #ffffff

# ========== BEHAVIOR ==========
# Scrollback buffer lines
scrollback_lines 750000

# Confirm before closing windows
confirm_os_window_close 0

# Cursor shape: (block|beam|underline)
cursor_shape beam

# ========== TABS ==========
include tab_bar_on.conf
# Map Alt+B to toggle the tab bar
#map alt+b launch --type=background ~/.config/kitty/toggle_tabs.sh
# ========== SESSIONS ==========
#map f5 save_as_session --base-dir ~/.local/share/kitty/sessions
#kitty -o 'map f1 save_as_session --use-foreground-process --relocatable' --session <(echo "layout vertical\nlaunch\nlaunch")
map f5 save_as_session --use-foreground-process --relocatable
